{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Accessibility Audit</title>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body>
    <div style="max-width: 600px; margin: 2rem auto; font-family: Arial, sans-serif;">
        <header>
            <a href="{% url 'audit_list' %}">&larr; Back to Audits</a>
            <h2>Submit Accessibility Audit</h2>
        </header>
        <hr><br>

        <form method="POST" action="{% url 'create_audit' %}">
            {% csrf_token %}

            <div>
                <label for="establishment_id"><strong>Select Establishment:</strong></label><br>
                <select name="establishment_id" id="establishment_id" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
                    <option value="" disabled selected>-- Choose an establishment --</option>
                    {% for est in establishments %}
                        <option value="{{ est.establishment_id }}">{{ est.name }} ({{ est.category }})</option>
                    {% endfor %}
                </select>
            </div>
            <br>

            <fieldset style="padding: 1rem; border: 1px solid #ccc; border-radius: 4px;">
                <legend><strong>Accessibility Features Present</strong></legend>
                
                <div style="margin-bottom: 0.5rem;">
                    <label>
                        <input type="checkbox" name="has_ramp_step_free">
                        Ramp / Step-Free Access
                    </label>
                </div>

                <div style="margin-bottom: 0.5rem;">
                    <label>
                        <input type="checkbox" name="has_wide_door">
                        Wide Door Entrance
                    </label>
                </div>

                <div style="margin-bottom: 0.5rem;">
                    <label>
                        <input type="checkbox" name="has_elevator">
                        Elevator Available
                    </label>
                </div>

                <div style="margin-bottom: 0.5rem;">
                    <label>
                        <input type="checkbox" name="has_accessible_restroom">
                        Accessible Restroom
                    </label>
                </div>

                <div>
                    <label>
                        <input type="checkbox" name="has_tactical_signage">
                        Tactile / Braille Signage
                    </label>
                </div>
            </fieldset>
            <br>

            <div>
                <label for="image_url"><strong>Photo URL (Optional):</strong></label><br>
                <input type="url" name="image_url" id="image_url" placeholder="https://example.com/photo.jpg" style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
            </div>
            <br>

            <button type="submit" style="padding: 0.6rem 1.2rem; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
                Submit Audit
            </button>
        </form>
    </div>
</body>
</html>
